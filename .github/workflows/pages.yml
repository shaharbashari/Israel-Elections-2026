name: Publish reviewed static site

on:
  workflow_dispatch:
    inputs:
      publish_approved:
        description: Publish only after coordinator factual and design approval
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use supported Node LTS without package caching
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test integrated release contract
        env:
          SITE_RELEASE_CHECK: "1"
        run: node --test tests/deployment.test.cjs
      - name: Build exact public artifact
        run: node scripts/build-site.cjs
      - name: Upload only public allowlisted files
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages-artifact
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && inputs.publish_approved
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require explicitly switched Actions Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.GH_TOKEN;
          delete process.env.GH_TOKEN;
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pages`, {
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
            },
            redirect: "error",
            signal: AbortSignal.timeout(30000)
          });
          if (!response.ok) throw new Error(`Cannot verify Pages source (${response.status}).`);
          const pages = await response.json();
          if (pages.build_type !== "workflow") throw new Error("Coordinator must switch Pages to GitHub Actions before publishing.");
          NODE
      - name: Read Pages configuration without enabling or changing it
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
